<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Spring QC · Monitor</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<link rel="stylesheet" href="/static/app.css">
<script>try{var t=localStorage.getItem('spring_qc_theme');if(t)document.documentElement.setAttribute('data-theme',t);}catch(e){}</script>
<style>
    body { overflow: hidden; }
    .mon { display: flex; flex-direction: column; height: calc(100vh - var(--nav-h)); }

    .mon__bar {
        display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
        padding: 12px clamp(14px, 3vw, 24px);
        background: var(--panel); border-bottom: 1px solid var(--border);
    }
    .mon__pick { display: flex; align-items: center; gap: 9px; }
    .mon__pick .select { width: auto; min-width: 250px; }
    .mon__stat {
        display: inline-flex; align-items: center; gap: 7px;
        height: 32px; padding: 0 13px; border-radius: 999px;
        font-size: 12px; font-weight: 700;
        background: var(--panel-2); border: 1px solid var(--border); color: var(--ink-soft);
    }
    .mon__stat::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; flex: 0 0 auto; }
    .mon__stat.active { color: var(--green); background: var(--green-bg); border-color: var(--green); }
    .mon__stat.error { color: var(--red); background: var(--red-bg); border-color: var(--red); }
    .mon__stat--muted::before { display: none; }

    .mon__grid {
        flex: 1; min-height: 0;
        display: grid; grid-template-columns: 1fr 380px; gap: 14px;
        padding: 14px clamp(14px, 3vw, 24px);
    }
    .mon__stage {
        position: relative; overflow: hidden;
        background: #0b0f14; border: 1px solid var(--border); border-radius: var(--r-lg);
        display: grid; place-items: center;
        box-shadow: inset 0 0 120px rgba(0, 0, 0, 0.5);
    }
    .mon__stage canvas { max-width: 100%; max-height: 100%; display: block; }
    .mon__placeholder {
        position: absolute; color: #7c8b98; font-size: 14px; line-height: 1.6;
        text-align: center; padding: 0 32px; max-width: 460px;
    }

    .mon__rail {
        display: flex; flex-direction: column; overflow: hidden;
        background: var(--panel); border: 1px solid var(--border); border-radius: var(--r-lg);
        box-shadow: var(--shadow);
    }
    .mon__rail-head {
        display: flex; align-items: center; justify-content: space-between; gap: 10px;
        padding: 13px 16px; border-bottom: 1px solid var(--border);
    }
    .mon__rail-head h2 { font-size: 12px; text-transform: uppercase; letter-spacing: 0.07em; }
    .mon__feed { flex: 1; overflow-y: auto; }
    .mon__feed table.data { font-size: 12.5px; }
    .mon__feed table.data thead th { position: sticky; top: 0; padding: 10px 14px; z-index: 1; }
    .mon__feed table.data tbody td { padding: 9px 14px; font-family: var(--font-mono); }
    .mon__feed table.data tbody td:first-child { font-weight: 700; }
    .mon__note { padding: 10px 16px; font-size: 11.5px; color: var(--ink-muted); border-top: 1px solid var(--border); }

    @media (max-width: 900px) {
        body { overflow: auto; }
        .mon { height: auto; }
        .mon__grid { grid-template-columns: 1fr; }
        .mon__stage { min-height: 260px; }
        .mon__rail { min-height: 320px; }
    }
</style>
</head>
<body>
<div id="app-nav"></div>

<div class="mon">
    <div class="mon__bar">
        <div class="mon__pick">
            <span class="field-label">Viewing</span>
            <select class="select" id="operator-select"><option value="">No live operators</option></select>
        </div>
        <span class="grow"></span>
        <span class="mon__stat mon__stat--muted" id="status">Not connected</span>
        <span class="mon__stat mon__stat--muted" id="frames">Frames: 0</span>
    </div>

    <div class="mon__grid">
        <div class="mon__stage">
            <canvas id="canvas" width="960" height="540"></canvas>
            <div class="mon__placeholder" id="placeholder">Select a live operator above to preview their inference stream.</div>
        </div>

        <aside class="mon__rail">
            <div class="mon__rail-head">
                <h2>Spring events</h2>
                <span class="badge">Total <b id="event-total">0</b></span>
            </div>
            <div class="mon__feed">
                <table class="data">
                    <thead>
                        <tr><th>S.No</th><th class="num">IN</th><th class="num">Live</th><th class="num">OUT</th><th class="num">Dur</th></tr>
                    </thead>
                    <tbody id="event-body"></tbody>
                </table>
                <div class="empty-state" id="event-empty">No events yet. Select a live operator to see S.No &amp; timing.</div>
            </div>
            <p class="mon__note">Preview only — the operator makes every decision on their station.</p>
        </aside>
    </div>
</div>

<script src="/static/nav.js"></script>
<script>
let ws = null;
let currentJobId = null;
let currentOperator = '';
let frameCount = 0;
const EVENTS = new Map();
const MAX_EVENT_ROWS = 250;   // keep the table (and its DOM nodes) bounded over a long shift
let eventTotal = 0;           // monotonic count (rows may be trimmed from the table)
let deepLinkOperator = new URLSearchParams(location.search).get('operator');

// --- video frame pump: only ever hold ONE undecoded frame; drop the rest ---
let latestFrameBuf = null;    // newest jpeg bytes not yet drawn
let decoding = false;
let frameUrl = null;
const frameImg = new Image();
frameImg.onload = () => {
    if (canvas.width !== frameImg.width) canvas.width = frameImg.width;
    if (canvas.height !== frameImg.height) canvas.height = frameImg.height;
    ctx.drawImage(frameImg, 0, 0);
    frameCount++;
    framesEl.textContent = 'Frames: ' + frameCount;
    if (frameUrl) { URL.revokeObjectURL(frameUrl); frameUrl = null; }
    decoding = false;
    pumpFrame();
};
frameImg.onerror = () => {
    if (frameUrl) { URL.revokeObjectURL(frameUrl); frameUrl = null; }
    decoding = false;
    pumpFrame();
};
function pumpFrame() {
    if (decoding || latestFrameBuf === null) return;
    if (document.hidden) { latestFrameBuf = null; return; }  // don't decode a hidden tab
    const buf = latestFrameBuf;
    latestFrameBuf = null;
    decoding = true;
    frameUrl = URL.createObjectURL(new Blob([buf], { type: 'image/jpeg' }));
    frameImg.src = frameUrl;
}
document.addEventListener('visibilitychange', () => { if (!document.hidden) pumpFrame(); });

const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const statusEl = document.getElementById('status');
const framesEl = document.getElementById('frames');
const sel = document.getElementById('operator-select');

function setStatus(text, cls = 'off') {
    statusEl.textContent = text;
    statusEl.className = 'mon__stat' + (cls && cls !== 'off' ? ' ' + cls : ' mon__stat--muted');
}

function fmt(v) {
    if (v === '' || v === undefined || v === null) return '-';
    return Number(v).toFixed(2);
}

async function refreshOperatorList() {
    let jobs = [];
    try { jobs = await (await fetch('/jobs')).json(); } catch (e) { return; }
    const liveJobs = jobs.filter(j => (j.status === 'running' || j.status === 'starting') && j.operator);

    const prev = sel.value;
    sel.innerHTML = '';
    if (!liveJobs.length) {
        sel.innerHTML = '<option value="">No live operators</option>';
    } else {
        sel.innerHTML = '<option value="">— Select an operator —</option>';
        liveJobs.forEach(j => {
            const opt = document.createElement('option');
            opt.value = j.operator;
            opt.textContent = j.operator + ' — ' + j.label;
            sel.appendChild(opt);
        });
    }
    if ([...sel.options].some(o => o.value === prev) && prev) {
        sel.value = prev;
    } else if (currentOperator && !liveJobs.some(j => j.operator === currentOperator)) {
        // The operator we were watching just went offline.
        stopWatching();
        setStatus('Stream ended', 'off');
        document.getElementById('placeholder').textContent = 'That stream ended. Select another live operator above.';
        document.getElementById('placeholder').style.display = '';
    }

    // Auto-connect to a newly live operator if nothing is being watched yet -
    // preferring a deep-linked operator (e.g. from the admin dashboard's
    // "Preview" link) over just picking the first one live.
    if (!currentOperator && liveJobs.length) {
        const wanted = deepLinkOperator && liveJobs.find(j => j.operator === deepLinkOperator);
        const target = wanted || liveJobs[0];
        deepLinkOperator = null;
        sel.value = target.operator;
        watchOperator(target.operator, target.job_id);
    }
}

sel.addEventListener('change', () => {
    const opName = sel.value;
    if (!opName) { stopWatching(); return; }
    fetch('/jobs?operator=' + encodeURIComponent(opName))
        .then(r => r.json())
        .then(jobs => {
            const running = jobs.find(j => j.status === 'running' || j.status === 'starting');
            if (running) watchOperator(opName, running.job_id);
        });
});

function stopWatching() {
    if (ws) { ws.close(); ws = null; }
    currentJobId = null;
    currentOperator = '';
    EVENTS.clear();
    eventTotal = 0;
    document.getElementById('event-body').innerHTML = '';
    document.getElementById('event-empty').style.display = '';
    document.getElementById('event-total').textContent = '0';
    frameCount = 0;
    framesEl.textContent = 'Frames: 0';
    latestFrameBuf = null;
    decoding = false;
    if (frameUrl) { URL.revokeObjectURL(frameUrl); frameUrl = null; }
    setStatus('Not connected', 'off');
}

// Get (or create) the table row for a S.No, trimming the oldest rows so the
// DOM node count stays bounded no matter how long the shift runs.
function ensureRow(sNo) {
    let row = EVENTS.get(sNo);
    if (row) return row;
    row = document.createElement('tr');
    row.id = 'row-' + sNo;
    document.getElementById('event-body').appendChild(row);
    EVENTS.set(sNo, row);
    eventTotal++;
    document.getElementById('event-empty').style.display = 'none';
    document.getElementById('event-total').textContent = eventTotal;
    while (EVENTS.size > MAX_EVENT_ROWS) {
        const oldest = EVENTS.keys().next().value;
        const oldRow = EVENTS.get(oldest);
        if (oldRow) oldRow.remove();
        EVENTS.delete(oldest);
    }
    return row;
}

function watchOperator(opName, jobId) {
    if (currentJobId === jobId) return;
    stopWatching();
    currentOperator = opName;
    currentJobId = jobId;
    document.getElementById('placeholder').style.display = 'none';
    connectWs(jobId);
}

function connectWs(jobId) {
    const proto = location.protocol === 'https:' ? 'wss' : 'ws';
    ws = new WebSocket(`${proto}://${location.host}/ws/${jobId}`);
    ws.binaryType = 'arraybuffer';
    setStatus('Connecting…', 'active');
    ws.onopen = () => setStatus('Live', 'active');
    ws.onmessage = (ev) => {
        if (typeof ev.data === 'string') {
            const msg = JSON.parse(ev.data);
            if (msg.type === 'event') addEvent(msg);
            else if (msg.type === 'live') updateLive(msg.live || {});
            else if (msg.type === 'completed') {
                setStatus(msg.status === 'error' ? 'Error' : 'Completed', msg.status === 'error' ? 'error' : 'active');
            } else if (msg.type === 'error') {
                setStatus('Error: ' + msg.message, 'error');
            }
        } else {
            latestFrameBuf = ev.data;   // replace any not-yet-drawn frame; stale frames are dropped
            pumpFrame();
        }
    };
    ws.onerror = () => setStatus('Connection error', 'error');
    ws.onclose = () => { if (currentJobId === jobId) setStatus('Disconnected', 'off'); };
}

function addEvent(ev) {
    document.getElementById('event-empty').style.display = 'none';
    if (ev.type !== 'event') return;
    const sNo = ev.s_no;
    const row = ensureRow(sNo);
    const inT = ev.in_time_sec !== undefined ? ev.in_time_sec : (row.dataset.inVal || '');
    if (ev.in_time_sec !== undefined) row.dataset.inVal = ev.in_time_sec;
    const outT = ev.out_time_sec !== undefined ? ev.out_time_sec : '';
    const dur = ev.duration_sec !== undefined ? ev.duration_sec : '';
    row.innerHTML = `
        <td>${sNo}</td>
        <td class="num">${fmt(inT)}</td>
        <td class="num live-${sNo}">${row.dataset.live || '-'}</td>
        <td class="num">${fmt(outT)}</td>
        <td class="num">${fmt(dur)}</td>`;
}

function updateLive(liveObj) {
    for (const sNoStr in liveObj) {
        const sNo = Number(sNoStr);
        const val = liveObj[sNoStr];
        const existed = EVENTS.has(sNo);
        const row = ensureRow(sNo);
        if (!existed) {
            row.innerHTML = `<td>${sNo}</td><td class="num">-</td><td class="num live-${sNo}">${fmt(val)}</td><td class="num">-</td><td class="num">-</td>`;
            continue;
        }
        row.dataset.live = fmt(val);
        const cell = row.querySelector('.live-' + sNo);
        if (cell) cell.textContent = fmt(val);
    }
}

refreshOperatorList();
setInterval(refreshOperatorList, 3000);
</script>
</body>
</html>
