; Spring QC Server configuration.
; Lives next to SpringQCServer.exe / SpringQCService.exe after install
; (C:\SpringQC\Server\springqc.ini by default). Edit and restart the
; service to apply changes - no rebuild needed.

[server]
host = 0.0.0.0
port = 8001
; Only used by SpringQCServer.exe (the console app); the service never
; opens a browser since it has no interactive session to open one in.
open_browser = true
browser_page = /admin

[database]
; mode is informational here; the real switch is whether `url` is set below.
; - Leave `url` empty to use the bundled Postgres in vendor/postgres
;   (auto-initialized on first run under C:\ProgramData\SpringQC\pgdata).
; - Set `url` to point this install at a shared/external PostgreSQL instead,
;   e.g. one already running for the site, or another Spring QC edge box's
;   database:
;     url = postgresql://spring_qc:CHANGE_ME@10.0.1.50:5432/spring_qc
url =
; Port the bundled Postgres listens on when no external `url` is set.
; Deliberately not 5432, so this can coexist with a site's own Postgres.
bundled_port = 5433
